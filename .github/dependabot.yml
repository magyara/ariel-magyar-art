version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      # Types must match the Node runtime in .nvmrc — bump by hand with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # react and react-dom must move together or npm ci fails on peer deps.
      # Listed first so it wins over minor-and-patch.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      # One PR for all other minor/patch bumps; majors still come individually.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
